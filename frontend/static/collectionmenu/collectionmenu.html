<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Collection Menu</title>
  <style>
    html,
  body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: rgba(0, 0, 0, 0);
    color: #9ed0ff;
    font-family: sans-serif;
    font-size: clamp(7px, min(1.35vh, 0.9vw), 18px);
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;
  }

  #menu-container {
    display: flex;
    flex-direction: column;
    transition: transform 0.3s ease;
    transform-origin: center center;
    background-image: url('./collectionmenu-frame.png');
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-position: center;
    width: 100vw;
    height: 100vh;
    max-width: 100vw;
    max-height: 100vh;
    box-sizing: border-box;
    padding: 18vh 13.5vw 5.5vh;
    overflow: hidden;
  }

    .menu-title {
      font-size: 3.75vh;
      font-weight: bold;
      text-align: center;
      margin-bottom: 1vh;
      padding: 1vh;
      color: #fff;
    }

    ul.menu {
      list-style: none;
      flex: 1 1 auto;
      min-height: 0;
      padding: clamp(3px, 0.45em, 8px);
      margin: 0;
      overflow: hidden;
    }

    li.menu-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(9ch, 34%);
      align-items: center;
      column-gap: clamp(6px, 1.2em, 18px);
      min-height: 0;
      padding: clamp(3px, 0.52em, 9px) clamp(6px, 0.8em, 14px);
      margin-bottom: clamp(3px, 0.34em, 7px);
      background-color: #222;
      border-radius: 0.5vh;
      cursor: pointer;
      position: relative;
      font-size: clamp(10px, 1.4em, 21px);
      line-height: 1.05;
      color: #9ed0ff;
    }

    li.menu-item.selected {
      background-color: #444;
    }

    li.menu-item.filter-separator {
      margin-top: clamp(4px, 0.8em, 14px);
    }

    li.menu-item.action-separator {
      margin-top: clamp(4px, 0.8em, 14px);
    }

    .dropdown-label {
      display: block;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dropdown-value {
      display: block;
      font-weight: bold;
      color: #b8e0ff;
      min-width: 0;
      max-width: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: right;
    }

    .popup {
      position: absolute;
      top: 100%;
      left: 0;
      background: #333;
      border: 1px solid #555;
      z-index: 1000;
      width: 100%;
      max-height: min(56vh, 520px);
      overflow-y: auto;
      overflow-x: hidden;
      font-size: clamp(10px, 1.4em, 21px);
    }

    .popup-option {
      padding: 0.45em 0.8em;
    }

    .popup-option.selected {
      background: #666;
    }

    #overlay-root {
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    #overlay-root.active {
      opacity: 1;
      pointer-events: auto;
    }

    .table-count {
      flex: 0 0 auto;
      text-align: center;
      font-size: clamp(9px, 1.1em, 17px);
      padding: clamp(3px, 0.45em, 8px);
      margin-top: clamp(3px, 0.45em, 8px);
      color: #aaa;
    }
  </style>
</head>

<body>
  <div id="menu-container">
    <ul class="menu" id="menu">
      <li class="menu-item" id="collection-item">
        <span class="dropdown-label">Collections:</span>
        <span class="dropdown-value" id="collection-value">None</span>
      </li>
      <li class="menu-item filter-separator" id="letter-item">
        <span class="dropdown-label">Starting Letter:</span>
        <span class="dropdown-value" id="letter-value">All</span>
      </li>
      <li class="menu-item" id="theme-item">
        <span class="dropdown-label">Theme:</span>
        <span class="dropdown-value" id="theme-value">All</span>
      </li>
      <li class="menu-item" id="type-item">
        <span class="dropdown-label">Type:</span>
        <span class="dropdown-value" id="type-value">All</span>
      </li>
      <li class="menu-item" id="manufacturer-item">
        <span class="dropdown-label">Manufacturer:</span>
        <span class="dropdown-value" id="manufacturer-value">All</span>
      </li>
      <li class="menu-item" id="year-item">
        <span class="dropdown-label">Year:</span>
        <span class="dropdown-value" id="year-value">All</span>
      </li>
      <li class="menu-item" id="rating-item">
        <span class="dropdown-label">Rating:</span>
        <span class="dropdown-value" id="rating-value">All</span>
      </li>
      <li class="menu-item" id="ratingmode-item">
        <span class="dropdown-label">Rating Mode:</span>
        <span class="dropdown-value" id="ratingmode-value">Exact</span>
      </li>
      <li class="menu-item" id="sortby-item">
        <span class="dropdown-label">Sort By:</span>
        <span class="dropdown-value" id="sortby-value">Title</span>
      </li>
      <li class="menu-item" id="orderby-item">
        <span class="dropdown-label">Order By:</span>
        <span class="dropdown-value" id="orderby-value">Descending</span>
      </li>
      <li class="menu-item action-separator" id="save-filter-item">Save Filter...</li>
      <li class="menu-item" id="close-item">Close</li>
    </ul>

    <div class="table-count" id="table-count">Table Count: 0</div>
    <!-- What a page press will do here. The sort decides the groups, so this changes
         with the sort above rather than being a setting of its own. -->
    <div class="table-count" id="paging-state"></div>

    <!-- Popup for dropdown -->
    <div id="dropdown-popup" class="popup" style="display: none;"></div>

    <!-- Dialog for saving filters -->
    <div id="save-filter-dialog" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #222; border: 2px solid #555; padding: 1.5vh 2vw; z-index: 2000; border-radius: 0.5vh;">
      <div style="font-size: 2.82vh; margin-bottom: 1vh;">Save Current Filter</div>
      <input type="text" id="filter-name-input" placeholder="Enter filter name..." style="width: 100%; padding: 0.5vh; font-size: 2.34vh; background: #333; color: #fff; border: 1px solid #555; border-radius: 0.25vh; margin-bottom: 1vh;">
      <div style="display: flex; gap: 1vw;">
        <button id="save-filter-btn" style="flex: 1; padding: 0.5vh; font-size: 2.34vh; background: #444; color: #fff; border: 1px solid #666; border-radius: 0.25vh; cursor: pointer;">Save</button>
        <button id="cancel-save-btn" style="flex: 1; padding: 0.5vh; font-size: 2.34vh; background: #333; color: #fff; border: 1px solid #555; border-radius: 0.25vh; cursor: pointer;">Cancel</button>
      </div>
      <div id="save-message" style="margin-top: 0.75vh; font-size: 1.88vh; text-align: center;"></div>
    </div>
  </div>

  <script>
    let rotationAngle = 0; // starting angle
    // Two ordered lists with a cursor, one nested in the other, so both are core's list
    // rather than two more copies of `(i +- 1 + n) % n`.
    let rows = null;
    let dropdown = null;
    let dropdownOpen = false;
    let currentDropdownType = null;

    // Filter data
    let collections = ['None'];
    let letters = ['All'];
    let themes = ['All'];
    let types = ['All'];
    let manufacturers = ['All'];
    let years = ['All'];
    let ratings = ['All', '1', '2', '3', '4', '5'];
    let ratingModes = ['Exact', 'Or Higher'];
    // The orders a collection can carry, in the same order and with the same labels the
    // Manager UI offers. This used to be the five 2.x sort names, which could not express
    // year, rating or play time - so a collection ordered by one of those showed as
    // 'Alpha' here and could not be chosen at all.
    let sortOptions = ['title', 'year', 'added', 'last_played', 'play_count',
                       'play_time_seconds', 'rating'];
    const SORT_LABELS = {
      title: 'Title', year: 'Year', added: 'Date Added', last_played: 'Last Played',
      play_count: 'Play Count', play_time_seconds: 'Play Time', rating: 'Rating',
      // Not offered, but a curated collection reports it and the label has to say so.
      manual: 'Curated',
    };
    const sortLabel = (token) => SORT_LABELS[token] || token;
    // Tokens with labels, for the same reason the sorts above are: the value stored and
    // the value shown were the same string, so the display spelling was the vocabulary.
    let orderOptions = ['desc', 'asc'];
    const DIRECTION_LABELS = { asc: 'Ascending', desc: 'Descending' };
    // Which dropdowns show something other than their stored value. The popup renders
    // the raw option, so without this the sort list reads `play_time_seconds`.
    const OPTION_LABELS = { sortby: SORT_LABELS, orderby: DIRECTION_LABELS };
    const optionLabel = (type, value) => (OPTION_LABELS[type] || {})[value] || value;
    const directionLabel = (token) => DIRECTION_LABELS[token] || token;

    // Current selections
    let collectionIndex = 0;
    let letterIndex = 0;
    let themeIndex = 0;
    let typeIndex = 0;
    let manufacturerIndex = 0;
    let yearIndex = 0;
    let ratingIndex = 0;
    let ratingModeIndex = 0;
    let sortByIndex = 0;
    let orderByIndex = 0;
    let filterDisplayOverrides = {};

    function setFilterDisplayOverrides(filterState = {}) {
      filterDisplayOverrides = {
        letter: filterState.letter || 'All',
        theme: filterState.theme || 'All',
        type: filterState.type || 'All',
        manufacturer: filterState.manufacturer || 'All',
        year: filterState.year || 'All',
        rating: String(filterState.rating || 'All'),
        ratingmode: filterState.rating_or_higher ? 'Or Higher' : 'Exact',
        sortby: filterState.sort || sortOptions[sortByIndex] || 'title',
        orderby: filterState.order || orderOptions[orderByIndex] || 'desc',
      };
    }

    function clearFilterDisplayOverrides() {
      filterDisplayOverrides = {};
    }

    async function init() {
      collections = collections.concat(await window.parent.vpin.call('get_collections'));
      letters = letters.concat(await window.parent.vpin.call('get_filter_letters'));
      themes = themes.concat(await window.parent.vpin.call('get_filter_themes'));
      types = types.concat(await window.parent.vpin.call('get_filter_types'));
      manufacturers = manufacturers.concat(await window.parent.vpin.call('get_filter_manufacturers'));
      years = years.concat(await window.parent.vpin.call('get_filter_years'));

      // Get current collection and set index
      const currentCollection = await window.parent.vpin.call('get_current_collection');
      collectionIndex = collections.indexOf(currentCollection);
      if (collectionIndex === -1) collectionIndex = 0; // fallback to None

      // Get current filter state and set indices
      const currentFilters = await window.parent.vpin.callInternal('get_current_filter_state');
      letterIndex = letters.indexOf(currentFilters.letter || 'All');
      if (letterIndex === -1) letterIndex = 0;
      themeIndex = themes.indexOf(currentFilters.theme || 'All');
      if (themeIndex === -1) themeIndex = 0;
      typeIndex = types.indexOf(currentFilters.type || 'All');
      if (typeIndex === -1) typeIndex = 0;
      manufacturerIndex = manufacturers.indexOf(currentFilters.manufacturer || 'All');
      if (manufacturerIndex === -1) manufacturerIndex = 0;
      yearIndex = years.indexOf(currentFilters.year || 'All');
      if (yearIndex === -1) yearIndex = 0;
      ratingIndex = ratings.indexOf(String(currentFilters.rating || 'All'));
      if (ratingIndex === -1) ratingIndex = 0;
      ratingModeIndex = currentFilters.rating_or_higher ? 1 : 0;
      if (ratings[ratingIndex] === 'All') ratingModeIndex = 0;

      // Get current sort state
      const currentSort = await window.parent.vpin.callInternal('get_current_sort_state');
      sortByIndex = sortOptions.indexOf(currentSort);
      if (sortByIndex === -1) sortByIndex = 0;
      const currentOrder = await window.parent.vpin.callInternal('get_current_order_state');
      orderByIndex = orderOptions.indexOf(currentOrder);
      if (orderByIndex === -1) orderByIndex = 0;

      if (currentCollection && currentCollection !== 'None') {
        setFilterDisplayOverrides({
          ...currentFilters,
          sort: currentSort || 'title',
          order: currentOrder || 'desc',
        });
      }

      window.parent.vpin.call("console_out", "Collection menu filters loaded");
    }

    window.parent.vpin.registerOverlayHandler("collectionMenu", handleInput);

    // Keyboard input is core's, on this window as well as the parent's - see
    // #listenForKeysIn in vpinfe-core.js. This file used to carry its own hardcoded
    // map, which only ran when focus happened to be in here and could not be configured.

    window.addEventListener("message", (event) => {
      const message = event.data;
      if (message.event === "reset state") {
        if (rows) rows.moveTo(0);
        dropdownOpen = false;
        updateMenu();
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      rotateMenu(rotationAngle); // apply initial rotation
    });

    function rotateMenu(degrees) {
      rotationAngle = degrees;
      document.getElementById('menu-container').style.transform =
        `rotate(${rotationAngle}deg)`;
    }

    function handleInput(input) {
      if (dropdownOpen) {
        switch (input) {
          case "page_previous":
          case "previous":
            dropdown.moveBy(-1);
            updateDropdownPopup();
            break;
          case "page_next":
          case "next":
            dropdown.moveBy(1);
            updateDropdownPopup();
            break;
          case "select":
            applyDropdownSelection();
            closeDropdown();
            break;
          case "back":
            closeDropdown();
            break;
        }
        return;
      }

      switch (input) {
        case "page_previous":
        case "previous":
          rows.moveBy(-1);
          break;
        case "page_next":
        case "next":
          rows.moveBy(1);
          break;
        case "select":
          const selectedItem = rows.current;
          if (selectedItem.id === 'collection-item') {
            openDropdown(selectedItem, 'collection');
          } else if (selectedItem.id === 'letter-item') {
            openDropdown(selectedItem, 'letter');
          } else if (selectedItem.id === 'theme-item') {
            openDropdown(selectedItem, 'theme');
          } else if (selectedItem.id === 'type-item') {
            openDropdown(selectedItem, 'type');
          } else if (selectedItem.id === 'manufacturer-item') {
            openDropdown(selectedItem, 'manufacturer');
          } else if (selectedItem.id === 'year-item') {
            openDropdown(selectedItem, 'year');
          } else if (selectedItem.id === 'rating-item') {
            openDropdown(selectedItem, 'rating');
          } else if (selectedItem.id === 'ratingmode-item') {
            openDropdown(selectedItem, 'ratingmode');
          } else if (selectedItem.id === 'sortby-item') {
            openDropdown(selectedItem, 'sortby');
          } else if (selectedItem.id === 'orderby-item') {
            openDropdown(selectedItem, 'orderby');
          } else if (selectedItem.id === 'save-filter-item') {
            openSaveFilterDialog();
          } else if (selectedItem.id === 'close-item') {
            window.parent.vpin.toggleOverlay("collectionMenu");
          }
          break;
        case "back":
        case "menu":
        case "collection_menu":
          // While the dialog is up, back dismisses it - that is the one action the
          // text mode lets through, and this is what it should reach.
          if (releaseInputMode) closeSaveFilterDialog();
          else window.parent.vpin.toggleOverlay("collectionMenu");
          break;
      }
      updateMenu();
    }

    async function updatePagingState() {
      const state = await window.parent.vpin.callInternal('get_paging_state');
      if (!state) return;
      document.getElementById('paging-state').textContent = state.group === 'sort'
        ? `Pages by ${state.kind}`
        : `Pages ${state.size} at a time`;
    }

    function updateTableCount() {
      const tableCount = window.parent.vpin.tableData ? window.parent.vpin.tableData.length : 0;
      document.getElementById('table-count').textContent = `Table Count: ${tableCount}`;
    }

    function updateMenu() {
      rows.items.forEach((item, i) => {
        item.classList.toggle('selected', i === rows.cursor);
      });

      document.getElementById('collection-value').textContent = collections[collectionIndex];
      document.getElementById('letter-value').textContent = filterDisplayOverrides.letter || letters[letterIndex];
      document.getElementById('theme-value').textContent = filterDisplayOverrides.theme || themes[themeIndex];
      document.getElementById('type-value').textContent = filterDisplayOverrides.type || types[typeIndex];
      document.getElementById('manufacturer-value').textContent = filterDisplayOverrides.manufacturer || manufacturers[manufacturerIndex];
      document.getElementById('year-value').textContent = filterDisplayOverrides.year || years[yearIndex];
      document.getElementById('rating-value').textContent = filterDisplayOverrides.rating || ratings[ratingIndex];
      document.getElementById('ratingmode-value').textContent = filterDisplayOverrides.ratingmode || ratingModes[ratingModeIndex];
      document.getElementById('sortby-value').textContent =
        sortLabel(filterDisplayOverrides.sortby || sortOptions[sortByIndex]);
      document.getElementById('orderby-value').textContent =
        directionLabel(filterDisplayOverrides.orderby || orderOptions[orderByIndex]);

      updateTableCount();
      updatePagingState();
    }

    function normalizeRatingMode() {
      if (ratings[ratingIndex] === 'All') {
        ratingModeIndex = 0;
      }
    }

    function getSelectedFilterValues() {
      normalizeRatingMode();
      const ratingValue = ratings[ratingIndex] === "All" ? "All" : ratings[ratingIndex];
      const ratingOrHigher = ratingValue !== "All" && ratingModes[ratingModeIndex] === 'Or Higher';
      return {
        letter: letters[letterIndex] === "All" ? "All" : letters[letterIndex],
        theme: themes[themeIndex] === "All" ? "All" : themes[themeIndex],
        type: types[typeIndex] === "All" ? "All" : types[typeIndex],
        manufacturer: manufacturers[manufacturerIndex] === "All" ? "All" : manufacturers[manufacturerIndex],
        year: years[yearIndex] === "All" ? "All" : years[yearIndex],
        rating: ratingValue,
        rating_or_higher: ratingOrHigher
      };
    }

    async function applyCurrentFiltersAndBroadcast() {
      clearFilterDisplayOverrides();
      const filters = getSelectedFilterValues();
      const count = await window.parent.vpin.callInternal(
        "apply_filters",
        filters.letter,
        filters.theme,
        filters.type,
        filters.manufacturer,
        filters.year,
        filters.rating,
        filters.rating_or_higher
      );
      await window.parent.vpin.callInternal("apply_sort", sortOptions[sortByIndex], orderOptions[orderByIndex]);
      window.parent.vpin.sendMessageToAllWindowsIncSelf({
        type: "TableDataChange",
        index: 0,
        filters,
        sort: sortOptions[sortByIndex],
        order: orderOptions[orderByIndex]
      });
      return count;
    }

    function getCurrentDropdownOptions() {
      switch (currentDropdownType) {
        case 'collection': return collections;
        case 'letter': return letters;
        case 'theme': return themes;
        case 'type': return types;
        case 'manufacturer': return manufacturers;
        case 'year': return years;
        case 'rating': return ratings;
        case 'ratingmode': return ratingModes;
        case 'sortby': return sortOptions;
        case 'orderby': return orderOptions;
        default: return [];
      }
    }

    function getCurrentIndex() {
      switch (currentDropdownType) {
        case 'collection': return collectionIndex;
        case 'letter': return letterIndex;
        case 'theme': return themeIndex;
        case 'type': return typeIndex;
        case 'manufacturer': return manufacturerIndex;
        case 'year': return yearIndex;
        case 'rating': return ratingIndex;
        case 'ratingmode': return ratingModeIndex;
        case 'sortby': return sortByIndex;
        case 'orderby': return orderByIndex;
        default: return 0;
      }
    }

    function openDropdown(targetItem, dropdownType) {
      dropdownOpen = true;
      currentDropdownType = dropdownType;
      // Built here because the options are computed per open, and the cursor starts on
      // whatever is currently chosen - clamped, since a stored value can outlive its list.
      dropdown = window.parent.vpin.createList(getCurrentDropdownOptions());
      dropdown.moveTo(getCurrentIndex());

      const popup = document.getElementById('dropdown-popup');
      popup.style.display = 'block';
      popup.style.top = (targetItem.offsetTop + targetItem.offsetHeight) + 'px';
      popup.style.left = targetItem.offsetLeft + 'px';
      popup.style.width = targetItem.offsetWidth + 'px';

      updateDropdownPopup();
    }

    function updateDropdownPopup() {
      const popup = document.getElementById('dropdown-popup');
      popup.innerHTML = '';
      // The list core is holding, not a fresh call: the cursor below indexes into it,
      // and two sources for one list is what this abstraction exists to stop.
      dropdown.items.forEach((option, i) => {
        const div = document.createElement('div');
        div.className = 'popup-option' + (i === dropdown.cursor ? ' selected' : '');
        div.textContent = optionLabel(currentDropdownType, option);
        popup.appendChild(div);
      });

      // Scroll selected item into view
      const selectedElement = popup.querySelector('.popup-option.selected');
      if (selectedElement) {
        selectedElement.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }

    async function applyDropdownSelection() {
      const selectedValue = dropdown.current;

      switch (currentDropdownType) {
        case 'collection':
          collectionIndex = dropdown.cursor;
          clearFilterDisplayOverrides();

          if (selectedValue == "None") {
            letterIndex = 0;
            themeIndex = 0;
            typeIndex = 0;
            manufacturerIndex = 0;
            yearIndex = 0;
            ratingIndex = 0;
            ratingModeIndex = 0;
            sortByIndex = 0;
            orderByIndex = 0;

            await window.parent.vpin.call("get_tables", true);
            window.parent.vpin.sendMessageToAllWindowsIncSelf({
              type: "TableDataChange",
              index: 0,
              collection: "None"
            });
          } else {
            await window.parent.vpin.call("set_tables_by_collection", selectedValue);
            await window.parent.vpin.call("get_tables");

            const filterState = await window.parent.vpin.callInternal("get_current_filter_state");
            const sortState = await window.parent.vpin.callInternal("get_current_sort_state");
            const orderState = await window.parent.vpin.callInternal("get_current_order_state");

            if (filterState && filterState.letter !== null) {
              letterIndex = letters.indexOf(filterState.letter);
              themeIndex = themes.indexOf(filterState.theme);
              typeIndex = types.indexOf(filterState.type);
              manufacturerIndex = manufacturers.indexOf(filterState.manufacturer);
              yearIndex = years.indexOf(filterState.year);
              ratingIndex = ratings.indexOf(String(filterState.rating || 'All'));
              ratingModeIndex = filterState.rating_or_higher ? 1 : 0;

              if (letterIndex === -1) letterIndex = 0;
              if (themeIndex === -1) themeIndex = 0;
              if (typeIndex === -1) typeIndex = 0;
              if (manufacturerIndex === -1) manufacturerIndex = 0;
              if (yearIndex === -1) yearIndex = 0;
              if (ratingIndex === -1) ratingIndex = 0;
              normalizeRatingMode();
              if (sortState) {
                const sortIdx = sortOptions.indexOf(sortState);
                if (sortIdx !== -1) {
                  sortByIndex = sortIdx;
                }
              }
              if (orderState) {
                const orderIdx = orderOptions.indexOf(orderState);
                if (orderIdx !== -1) {
                  orderByIndex = orderIdx;
                }
              }
              setFilterDisplayOverrides({
                ...filterState,
                sort: sortState || 'title',
                order: orderState || 'desc',
              });
              window.parent.vpin.sendMessageToAllWindowsIncSelf({
                type: "TableDataChange",
                index: 0,
                collection: selectedValue
              });
            } else {
              letterIndex = 0;
              themeIndex = 0;
              typeIndex = 0;
              manufacturerIndex = 0;
              yearIndex = 0;
              ratingIndex = 0;
              ratingModeIndex = 0;
              sortByIndex = 0;
              orderByIndex = 0;

              window.parent.vpin.sendMessageToAllWindowsIncSelf({
                type: "TableDataChange",
                index: 0,
                collection: selectedValue
              });
            }
          }
          updateMenu();
          window.parent.vpin.toggleOverlay("collectionMenu");
          break;

        case 'letter':
          letterIndex = dropdown.cursor;
          collectionIndex = 0;
          document.getElementById('table-count').textContent = `Table Count: ${await applyCurrentFiltersAndBroadcast()}`;
          break;

        case 'theme':
          themeIndex = dropdown.cursor;
          collectionIndex = 0;
          document.getElementById('table-count').textContent = `Table Count: ${await applyCurrentFiltersAndBroadcast()}`;
          break;

        case 'type':
          typeIndex = dropdown.cursor;
          collectionIndex = 0;
          document.getElementById('table-count').textContent = `Table Count: ${await applyCurrentFiltersAndBroadcast()}`;
          break;

        case 'manufacturer':
          manufacturerIndex = dropdown.cursor;
          collectionIndex = 0;
          document.getElementById('table-count').textContent = `Table Count: ${await applyCurrentFiltersAndBroadcast()}`;
          break;

        case 'year':
          yearIndex = dropdown.cursor;
          collectionIndex = 0;
          document.getElementById('table-count').textContent = `Table Count: ${await applyCurrentFiltersAndBroadcast()}`;
          break;

        case 'rating':
          ratingIndex = dropdown.cursor;
          collectionIndex = 0;
          normalizeRatingMode();
          document.getElementById('table-count').textContent = `Table Count: ${await applyCurrentFiltersAndBroadcast()}`;
          break;

        case 'ratingmode':
          ratingModeIndex = dropdown.cursor;
          collectionIndex = 0;
          normalizeRatingMode();
          document.getElementById('table-count').textContent = `Table Count: ${await applyCurrentFiltersAndBroadcast()}`;
          break;

        case 'sortby':
          sortByIndex = dropdown.cursor;
          if (collectionIndex !== 0) {
            filterDisplayOverrides.sortby = sortOptions[sortByIndex];
          }
          const sortCount = await window.parent.vpin.callInternal("apply_sort", sortOptions[sortByIndex], orderOptions[orderByIndex]);
          window.parent.vpin.sendMessageToAllWindowsIncSelf({
            type: "TableDataChange",
            index: 0,
            sort: sortOptions[sortByIndex],
            order: orderOptions[orderByIndex]
          });
          document.getElementById('table-count').textContent = `Table Count: ${sortCount}`;
          break;

        case 'orderby':
          orderByIndex = dropdown.cursor;
          if (collectionIndex !== 0) {
            filterDisplayOverrides.orderby = orderOptions[orderByIndex];
          }
          const orderCount = await window.parent.vpin.callInternal("apply_sort", sortOptions[sortByIndex], orderOptions[orderByIndex]);
          window.parent.vpin.sendMessageToAllWindowsIncSelf({
            type: "TableDataChange",
            index: 0,
            sort: sortOptions[sortByIndex],
            order: orderOptions[orderByIndex]
          });
          document.getElementById('table-count').textContent = `Table Count: ${orderCount}`;
          break;
      }

      window.parent.vpin.call("console_out", `Filter applied: ${currentDropdownType} = ${selectedValue}`);
    }

    function closeDropdown() {
      dropdownOpen = false;
      document.getElementById('dropdown-popup').style.display = 'none';
      updateMenu();
    }

    // Held while the dialog is up, so the mode can be popped exactly once.
    let releaseInputMode = null;

    function openSaveFilterDialog() {
      const dialog = document.getElementById('save-filter-dialog');
      const input = document.getElementById('filter-name-input');
      const message = document.getElementById('save-message');

      input.value = '';
      message.textContent = '';
      dialog.style.display = 'block';
      input.focus();
      // Typing owns the keys now. Without this the menu behind the dialog kept
      // driving on the arrows, and Enter fired select and opened a dropdown instead
      // of reaching the field - so the dialog could not be completed from a cabinet.
      releaseInputMode = window.parent.vpin.pushInputMode('text');
    }

    function closeSaveFilterDialog() {
      const dialog = document.getElementById('save-filter-dialog');
      dialog.style.display = 'none';
      if (releaseInputMode) releaseInputMode();
      releaseInputMode = null;
    }

    async function saveCurrentFilter() {
      const input = document.getElementById('filter-name-input');
      const message = document.getElementById('save-message');
      const filterName = input.value.trim();

      if (!filterName) {
        message.textContent = 'Please enter a filter name';
        message.style.color = '#f88';
        return;
      }

      // Check if any filters or sort are set (not all defaults)
      const hasActiveFilters =
        (letters[letterIndex] !== "All") ||
        (themes[themeIndex] !== "All") ||
        (types[typeIndex] !== "All") ||
        (manufacturers[manufacturerIndex] !== "All") ||
        (ratings[ratingIndex] !== "All") ||
        (years[yearIndex] !== "All") ||
        (sortOptions[sortByIndex] !== "title") ||
        (orderOptions[orderByIndex] !== "desc");

      if (!hasActiveFilters) {
        message.textContent = 'No filters or sort order active. Set at least one before saving.';
        message.style.color = '#f88';
        return;
      }

      const selectedFilters = getSelectedFilterValues();

      // Save the filter
      const result = await window.parent.vpin.call("save_filter_collection",
        filterName,
        selectedFilters.letter,
        selectedFilters.theme,
        selectedFilters.type,
        selectedFilters.manufacturer,
        selectedFilters.year,
        sortOptions[sortByIndex],
        selectedFilters.rating,
        selectedFilters.rating_or_higher,
        orderOptions[orderByIndex]
      );

      if (result.success) {
        message.textContent = result.message;
        message.style.color = '#8f8';

        // Reload collections list
        collections = ['None'].concat(await window.parent.vpin.call('get_collections'));

        // Close dialog after 2 seconds
        setTimeout(() => {
          closeSaveFilterDialog();
        }, 2000);
      } else {
        message.textContent = result.message;
        message.style.color = '#f88';
      }
    }

    window.onload = async () => {
      await init();
      rows = window.parent.vpin.createList(
        Array.from(document.querySelectorAll('.menu-item')));
      updateMenu();

      // Set up save filter dialog buttons
      document.getElementById('save-filter-btn').addEventListener('click', saveCurrentFilter);
      document.getElementById('cancel-save-btn').addEventListener('click', closeSaveFilterDialog);

      // Allow Enter key to save
      document.getElementById('filter-name-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          saveCurrentFilter();
        }
      });
    };
  </script>
</body>

</html>
