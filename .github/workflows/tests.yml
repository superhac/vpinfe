name: Tests

on:
  push:
    branches: [ master, vpinfe-3.0 ]
  pull_request:
    branches: [ master, vpinfe-3.0 ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The suite doesn't need the DOF/libdmdutil bundles or Chromium the build
      # job fetches, so this stays a fast check that runs on its own.
      - name: Run tests
        run: python -m unittest discover tests

      # vpinfe-core.js is the largest single piece of theme-facing code and had no
      # tests at all until these. Node's built-in runner, so there is nothing to
      # install: the repo has no JavaScript dependencies and should not gain any.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run frontend tests
        run: npm test
