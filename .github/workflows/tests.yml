name: Tests

on:
  push:
    branches: [ master, vpinfe-3.0 ]
  pull_request:
    branches: [ master, vpinfe-3.0 ]

# One run per branch. A second push supersedes the first rather than queueing behind
# it - a tag run is exempt, because cancelling one halfway leaves a partial release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The suite doesn't need the DOF/libdmdutil bundles or Chromium the build
      # job fetches, so this stays a fast check that runs on its own.
      - name: Run tests
        run: python -m unittest discover -t . -s tests

      # vpinfe-core.js is the largest single piece of theme-facing code and had no
      # tests at all until these. Node's built-in runner, so there is nothing to
      # install: the repo has no JavaScript dependencies and should not gain any.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The manifest lives beside the tests, not at the repo root - node resolves
      # "type": "module" from the nearest package.json walking up from a test file.
      - name: Run frontend tests
        run: npm test
        working-directory: tests/js

  # A frozen build carries its own 3.14. A source checkout uses whatever the machine has,
  # and the Debian a cabinet runs ships 3.13 - where annotations are evaluated where they
  # are written rather than lazily. tests/invariants/test_annotations_are_deferred.py
  # catches the cause; this catches anything else that only shows up on the older one.
  imports-on-oldest:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import every module
        run: |
          python - <<'PY'
          import importlib, pathlib, sys
          failed = []
          for package in ("apps", "common", "console", "extensions", "frontend", "httpapi"):
              for path in sorted(pathlib.Path(package).rglob("*.py")):
                  name = ".".join(path.with_suffix("").parts)
                  if name.endswith(".__init__"):
                      name = name[: -len(".__init__")]
                  try:
                      importlib.import_module(name)
                  except Exception as exc:
                      failed.append(f"{name}: {type(exc).__name__}: {exc}")
          for one in failed:
              print(one)
          sys.exit(1 if failed else 0)
          PY
