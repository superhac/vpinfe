[tool.ruff]
line-length = 100
target-version = "py314"
# managerui/maps is a vendored drop of tomlogic/pinmame-nvram-maps.
extend-exclude = ["third-party", "chromium", "web", "managerui/maps"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Config must resolve before anything under common/ is imported, so these import late.
"main.py" = ["E402"]
"managerui/managerui.py" = ["E402"]
# E701: handle_button's match arms are a dispatch table, one call each.
"managerui/pages/remote.py" = ["E402", "E701"]
# Seeds roms.json and the config paths before importing what it tests.
"tests/games/test_score_parser.py" = ["E402"]
# NiceGUI widget chains. Wrapping one splits it across four lines. Pages only.
"managerui/pages/*.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI is calls in argument defaults, which B008 is right to flag anywhere else.
extend-immutable-calls = [
    "fastapi.Body", "fastapi.Depends", "fastapi.File", "fastapi.Form",
    "fastapi.Header", "fastapi.Path", "fastapi.Query",
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "common", "console", "extensions", "frontend", "httpapi",
                     "managerui"]

[tool.mypy]
python_version = "3.14"
# Named here, not on the command line, so CI, the hook and a local run agree.
# managerui is left out: it retires with the Manager UI.
files = ["apps", "common", "console", "extensions", "frontend", "httpapi"]
# apps/ and extensions/ are namespace packages with no root __init__.py. Without these two,
# mypy aborts on a duplicate module name and checks nothing while exiting clean.
explicit_package_bases = true
mypy_path = "."
# NiceGUI, DOF and the third_party drops ship no stubs.
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Every function here is annotated. Held that way because it is the wire contract:
# an unannotated handler is one whose payload nothing checks.
module = ["apps.*", "extensions.*", "httpapi.*"]
disallow_untyped_defs = true
