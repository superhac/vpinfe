[tool.ruff]
line-length = 100
target-version = "py314"
# managerui/maps is a vendored drop of tomlogic/pinmame-nvram-maps, tools included.
# Linting it reports someone else's style as our debt, and fixing it would conflict on
# the next update.
extend-exclude = ["third-party", "chromium", "web", "managerui/maps"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, N PEP 8 naming,
# UP modern syntax, B common bugs.
select = ["E", "W", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Config has to be resolved before anything under common/ is imported, so these
# files import after executing statements on purpose.
"main.py" = ["E402"]
"managerui/managerui.py" = ["E402"]
# handle_button is a nested match over button names, every arm a single call. All 42 of
# the tree's E701s are those arms, and splitting them doubles the block's length to say
# the same thing - the one-line form is what makes it read as the dispatch table it is.
"managerui/pages/remote.py" = ["E402", "E701"]
# score_parser reads roms.json and the config paths at import, so the test has to seed
# them first. It is the only test that does; the rest of tests/ imports normally.
"tests/games/test_score_parser.py" = ["E402"]
# NiceGUI builds a widget by chaining .classes()/.props() with Tailwind strings, and a
# page is hundreds of them. 866 of the tree's 1047 long lines are here, and wrapping
# them splits one widget across four lines without making it read better. Three of the
# 21 page modules have any test coverage, so a reflow is also unverifiable. Deliberately
# scoped to the pages rather than tree-wide: the limit still applies everywhere else.
"managerui/pages/*.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole DI design is calls in argument defaults - Depends(), Query(),
# Body(), File(), Form(). B008 is right in general and wrong for these.
extend-immutable-calls = [
    "fastapi.Body", "fastapi.Depends", "fastapi.File", "fastapi.Form",
    "fastapi.Header", "fastapi.Path", "fastapi.Query",
]

[tool.ruff.lint.isort]
known-first-party = ["common", "frontend", "httpapi", "managerui"]
